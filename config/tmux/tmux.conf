set -g default-terminal 'tmux-256color'
# xterm* includes Ghostty. Keep tmux's own TERM inside panes.
set -as terminal-features ',xterm*:RGB'
set -g mouse on
set -s escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Catppuccin Mocha colors.
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left '#[fg=#cba6f7,bold] #S #[default]'
set -g status-right '#[fg=#89b4fa]#H #[fg=#a6adc8]%H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style 'bg=#313244,fg=#cba6f7,bold'
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
setw -g mode-style 'bg=#cba6f7,fg=#1e1e2e'

source-file -q ~/.tmux.conf.local
